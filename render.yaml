# Render Blueprint — NaijaJobber API
# https://render.com/docs/blueprint-spec
#
# 1. Push this repo to GitHub
# 2. Render Dashboard → New → Blueprint → select repo
# 3. Fill sync:false secrets in the dashboard when prompted
#
# After Vercel is live, set FRONTEND_URL to your Vercel URL and redeploy.

services:
  - type: web
    name: naijajobber-api
    runtime: node
    plan: free
    rootDir: backend
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: API_PREFIX
        value: api/v1
      - key: FRONTEND_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_HOST
        value: "127.0.0.1"
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        value: ""
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: THROTTLE_TTL
        value: "60"
      - key: THROTTLE_LIMIT
        value: "100"
      - key: PAYMENT_MODE
        value: mock
      - key: PREFERRED_PAYMENT_PROVIDER
        value: mock
      - key: AI_MODE
        value: mock
      - key: MAIL_FROM
        value: NaijaJobber <noreply@naijajobber.com>
